<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <a class="navbar-brand" href="#">Task Manager</a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav me-auto">
      <!-- Only show these if the user is an Editor -->
      <li class="nav-item" *ngIf="isEditor">
        <a class="nav-link active">Dashboard</a>
      </li>

      <!-- Viewer-Specific Section -->
      <li class="nav-item" *ngIf="!isEditor">
        <a class="nav-link active">View Tasks</a>
      </li>

    </ul>

    <ul class="navbar-nav">
      <li class="nav-item">
        <span class="nav-link text-white">Welcome, {{ userName }}</span>
      </li>
      <!-- Profile Dropdown -->
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown"
          aria-expanded="false">
          Profile
        </a>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
          <li>
            <a class="dropdown-item" routerLink="/profile">Edit Profile</a>
          </li>
          <li>
            <a class="dropdown-item" routerLink="/change-password">Change Password</a>
          </li>
          <!-- Role Assiged -->
          <li class="nav-item">
            <a class="dropdown-item">Role: {{ userRole }}</a>  
          </li>
        </ul>
      </li>

      <!-- Logout Button -->
      <li class="nav-item">
        <a class="nav-link" href="#" (click)="logout()">Logout</a>
      </li>
    </ul>
  </div>
</nav>

<!-- Editor-Specific Section -->
<div class="container mt-4" *ngIf="isEditor">
  <div class="row">
    <!-- Left Column (Col-4): Create Task -->
    <div class="col-md-4">
      <app-createtask></app-createtask>
    </div>

    <!-- Right Column (Col-8): View Task -->
    <div class="col-md-8">
      <app-viewtask></app-viewtask>
    </div>
  </div>
</div>

<!-- Viewer-Specific Section -->
<div class="container mt-4" *ngIf="!isEditor">
  <div class="row">
    <div class="col-md-12">
      <app-readonly></app-readonly>
    </div>
  </div>
</div>
