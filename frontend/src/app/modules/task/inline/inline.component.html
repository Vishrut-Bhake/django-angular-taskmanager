<h3>Task List</h3>

<!-- Filters Section -->
<div class="filter-container">
  <form [formGroup]="filterForm">
    <mat-form-field appearance="outline" class="search-box">
      <mat-label>Search Tasks</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput formControlName="searchQuery" placeholder="Search by Name, Description">
    </mat-form-field>

    <!-- Date Range Picker -->
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Task Date Range</mat-label>
      <mat-date-range-input [rangePicker]="picker" formGroupName="date_range">
        <input matStartDate formControlName="start" placeholder="Start date">
        <input matEndDate formControlName="end" placeholder="End date">
      </mat-date-range-input>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-date-range-picker #picker></mat-date-range-picker>
    </mat-form-field>

    <button mat-button color="primary" (click)="applyFilters()">Apply Filters</button>
    <button mat-button color="warn" (click)="resetFilters()">Reset</button>
    <button mat-raised-button color="primary" (click)="downloadPDF()"> Download PDF  </button>
  </form>
</div>

<div>
  <!-- Task Status Filter (Dropdown) -->
  <mat-form-field appearance="outline">
    <mat-label>Task Status</mat-label>
    <mat-select #select multiple [(ngModel)]="selectedStatuses" (selectionChange)="optionClick()">
      
      <!-- "Select All" Checkbox -->
      <div class="select-all">
        <mat-checkbox [(ngModel)]="allSelected" [ngModelOptions]="{standalone: true}" 
          (change)="toggleAllSelection()">Select All</mat-checkbox>
      </div>
  
      <!-- Individual Status Options -->
      <mat-option *ngFor="let status of taskStatusOptions" [value]="status">
        {{ status }}
      </mat-option>
  
    </mat-select>
  </mat-form-field>
</div>

<!-- Task Table with Inline Editing -->
<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
  
  <!-- Add New Task Row -->
  <tr>
    <td><input matInput placeholder="ID" [(ngModel)]="newTask.id"></td>
    <td><input matInput placeholder="Task Name" [(ngModel)]="newTask.task_name"></td>
    <td><input matInput placeholder="Description" [(ngModel)]="newTask.task_description"></td>
    <td>
      <mat-select [(ngModel)]="newTask.task_status">
        <mat-option *ngFor="let status of taskStatusOptions" [value]="status">
          {{ status }}
        </mat-option>
      </mat-select>
    </td>
    <td><input matInput placeholder="Priority" [(ngModel)]="newTask.task_priority"></td>
    <td>
      <button mat-icon-button color="primary" (click)="createTask()">
        <mat-icon>add</mat-icon>
      </button>
    </td>
  </tr>

  <!-- Table Headers -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
    <td mat-cell *matCellDef="let task"> {{ task.id }} </td>
  </ng-container>

  <ng-container matColumnDef="task_name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
    <td mat-cell *matCellDef="let task">
      <input *ngIf="task.isEditing" matInput [(ngModel)]="task.task_name">
      <span *ngIf="!task.isEditing" (click)="editTask(task)">{{ task.task_name }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="task_description">
    <th mat-header-cell *matHeaderCellDef> Description </th>
    <td mat-cell *matCellDef="let task">
      <input *ngIf="task.isEditing" matInput [(ngModel)]="task.task_description">
      <span *ngIf="!task.isEditing" (click)="editTask(task)">{{ task.task_description }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="task_status">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
    <td mat-cell *matCellDef="let task">
      <mat-select *ngIf="task.isEditing" [(ngModel)]="task.task_status">
        <mat-option *ngFor="let status of taskStatusOptions" [value]="status">
          {{ status }}
        </mat-option>
      </mat-select>
      <span *ngIf="!task.isEditing" (click)="editTask(task)">{{ task.task_status }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="task_priority">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Priority </th>
    <td mat-cell *matCellDef="let task">
      <input *ngIf="task.isEditing" matInput [(ngModel)]="task.task_priority">
      <span *ngIf="!task.isEditing" (click)="editTask(task)">{{ task.task_priority }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let task">
      <button mat-icon-button color="primary" *ngIf="!task.isEditing" (click)="editTask(task)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="deleteTask(task.id)">
        <mat-icon>delete</mat-icon>
      </button>
      <button mat-icon-button color="primary" *ngIf="task.isEditing" (click)="saveTask(task)">
        <mat-icon>save</mat-icon>
      </button>
      <button mat-icon-button color="warn" *ngIf="task.isEditing" (click)="cancelEdit(task)">
        <mat-icon>cancel</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<!-- MatPaginator Connected to Table -->
<mat-paginator
  [length]="totalRecords"
  [pageSize]="pageSize"
  [pageSizeOptions]="[5, 10, 20]"
  (page)="onPageChange($event)"
  showFirstLastButtons>
</mat-paginator>
