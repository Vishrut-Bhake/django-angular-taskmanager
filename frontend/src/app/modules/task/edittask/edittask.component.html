<h2 mat-dialog-title>Edit Task</h2>

<mat-dialog-content *ngIf="!isLoading; else loadingTemplate">
  <form [formGroup]="editTaskForm">
    <!-- Task Name -->
    <mat-form-field class="w-100">
      <mat-label>Task Name</mat-label>
      <input matInput formControlName="task_name" required>
    </mat-form-field>

    <!-- Description -->
    <mat-form-field class="w-100">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="task_description" required></textarea>
    </mat-form-field>

    <!-- Status -->
    <mat-form-field class="w-100">
      <mat-label>Status</mat-label>
      <mat-select formControlName="task_status">
        <mat-option value="Open">Open</mat-option>
        <mat-option value="In Progress">In Progress</mat-option>
        <mat-option value="Completed">Completed</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Priority -->
    <mat-form-field class="w-100">
      <mat-label>Priority</mat-label>
      <input matInput type="number" formControlName="task_priority" min="1" max="100" required>
    </mat-form-field>

    <!-- File Upload -->
    <div class="file-upload">
      <label>Upload File:</label>
      <input type="file" (change)="onFileSelected($event)">
      
      <!-- Show current file if exists -->
      <p *ngIf="taskFileUrl">
      </p>
    </div>
  </form>
</mat-dialog-content>

<!-- Loading State -->
<ng-template #loadingTemplate>
  <div class="text-center">
    <mat-spinner></mat-spinner>
    <p>Loading task details...</p>
  </div>
</ng-template>

<mat-dialog-actions align="end">
  <button mat-button color="warn" (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="updateTask()" [disabled]="editTaskForm.invalid">Update</button>
</mat-dialog-actions>
