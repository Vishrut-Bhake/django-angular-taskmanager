<h3>Task List</h3>

<!-- Filters Section -->
<div class="filter-container">
  <form [formGroup]="filterForm">
    <mat-form-field appearance="outline" class="search-box">
      <mat-label>Search Tasks</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [(ngModel)]="filterText" formControlName="task_description" 
        placeholder="Search by Name, Description" (input)="applySearchFilter()">
    </mat-form-field>

    <!-- Date Range Picker -->
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Task Date Range</mat-label>
      <mat-date-range-input [rangePicker]="picker" formGroupName="date_range">
        <input matStartDate formControlName="start" placeholder="Start date">
        <input matEndDate formControlName="end" placeholder="End date">
      </mat-date-range-input>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-date-range-picker #picker></mat-date-range-picker>
    </mat-form-field>

    <!-- Task Status Filter (Dropdown) -->
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Task Status</mat-label>
      <mat-select [(value)]="selectedStatuses" (selectionChange)="applyFilters()" multiple>
        <mat-option *ngFor="let status of taskStatusOptions" [value]="status">
          {{ status }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <div class="download">
      <button mat-raised-button color="primary" (click)="downloadPDF()">
        Download PDF
      </button>
    </div>

    <button mat-button color="primary" (click)="applyFilters()">Apply Filters</button>
    <button mat-button color="warn" (click)="resetFilters()">Reset</button>
  </form>
</div>

<!-- Task Table with Pagination -->
<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8" *ngIf="dataSource.data.length > 0">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
    <td mat-cell *matCellDef="let task"> {{ task.id }} </td>
  </ng-container>

  <ng-container matColumnDef="task_name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
    <td mat-cell *matCellDef="let task"> {{ task.task_name }} </td>
  </ng-container>

  <ng-container matColumnDef="task_description">
    <th mat-header-cell *matHeaderCellDef> Description </th>
    <td mat-cell *matCellDef="let task"> {{ task.task_description }} </td>
  </ng-container>

  <ng-container matColumnDef="task_status">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
    <td mat-cell *matCellDef="let task"> {{ task.task_status }} </td>
  </ng-container>

  <ng-container matColumnDef="task_priority">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Priority </th>
    <td mat-cell *matCellDef="let task"> {{ task.task_priority }} </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let task">
      <button mat-icon-button color="primary" (click)="editTask(task.id)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="deleteTask(task.id)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<!-- ✅ MatPaginator Connected to Table -->
<mat-paginator [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 20]" 
  (page)="onPageChange($event)" showFirstLastButtons>
</mat-paginator>
